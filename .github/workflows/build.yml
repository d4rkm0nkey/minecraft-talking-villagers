name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-editor/package-lock.json
      - name: web editor – install, check, test, build
        working-directory: web-editor
        # the tests also export a .voicepack that WebEditorExportTest validates with the mod's reader
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build and test
        run: ./gradlew build
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkingvillagers
          path: |
            fabric/build/libs/
            neoforge/build/libs/
