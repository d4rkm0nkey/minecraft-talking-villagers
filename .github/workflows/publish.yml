name: publish
# Runs when a tag like v2.0.0 or v2.0.0-beta.1 is pushed. Needs the repository secrets
# MODRINTH_TOKEN and CURSEFORGE_TOKEN and the project ids below.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MODRINTH_ID: talking-villagers   # TODO: Modrinth project id
  CURSEFORGE_ID: '000000'          # TODO: CurseForge project id

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: check tag matches version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: build
        run: ./gradlew build
      - name: release notes (newest section of the changelog)
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
      - name: publish fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: fabric/build/libs/!(*-@(sources|javadoc)).jar
          name: Talking Villagers ${{ github.ref_name }} (Fabric)
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 26.3
          dependencies: |
            fabric-api(required)
            modmenu(recommended)
      - name: publish neoforge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: neoforge/build/libs/!(*-@(sources|javadoc)).jar
          name: Talking Villagers ${{ github.ref_name }} (NeoForge)
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 26.3
